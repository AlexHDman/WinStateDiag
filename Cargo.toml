[package]
name = "win_state_diag"
version = "1.12.0"
edition = "2024"
authors = ["EXPC Design and Production"]
description = "Portable Windows state diagnostic center"
publish = false

# The shipped EXE carries a requireAdministrator manifest (build.rs, scoped to
# this bin). Cargo applies bin-scoped link args to the bin's own unittest
# harness too, so the bin has no test harness: all code and tests live in the
# library (src/lib.rs) and `cargo test` never needs elevation.
[[bin]]
name = "win_state_diag"
path = "src/main.rs"
test = false

[dependencies]
powerlab-core = { path = "third_party/powerlab-core" }
egui = "0.36"
eframe = "0.36"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Memory",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
